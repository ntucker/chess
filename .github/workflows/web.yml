# Publishes the web app to GitHub Pages: every push to main replaces the site,
# and every pull request from this repository gets a preview under
# pr-preview/pr-<number>/, linked in a comment on the pull request and removed
# when it closes. Fork and Dependabot pull requests only build. Setup is in
# README.md, under "Web deploys".
name: Web

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

# Setup Pages reads the site's settings (its base path and address). Only the
# publish job writes.
permissions:
  contents: read
  pages: read

env:
  # A pull request's preview folder, under the site; empty for main.
  PREVIEW: ${{ github.event_name == 'pull_request' && format('pr-preview/pr-{0}', github.event.number) || '' }}

jobs:
  # .agents/projects/autoland.md lists this job's name as a required check; rename both together.
  build:
    name: Build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer push to a pull request makes its older build worthless. Every
    # other run gets its own group, because GitHub marks a cancelled run's
    # commit failed; a build of main stops itself instead (see the export).
    concurrency:
      group: pages-build-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    outputs:
      site-url: ${{ steps.pages.outputs.base_url }}
      superseded: ${{ steps.export.outputs.superseded }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install
        # Yarn turns on hardened mode for public pull requests: it re-resolves the
        # lockfile to catch tampering, which costs about 5 s. Only fork pull
        # requests keep it: branches in this repo come from people with write
        # access, who are trusted with yarn.lock. Other events never use it.
        env:
          YARN_ENABLE_HARDENED_MODE: ${{ github.event.pull_request.head.repo.fork && '1' || '0' }}
        run: yarn install --immutable

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Full Stockfish (public/stockfish/, 99 MB) would count again in every
      # preview's folder toward Pages' 1 GB site limit. A preview loads the
      # live site's copy instead when the live site serves the same files,
      # compared by size (src/stockfish/full.ts keys its cache the same way).
      # A preview whose pull request changes the build keeps its own.
      - name: Share the live site's full Stockfish
        id: stockfish
        if: env.PREVIEW
        env:
          LIVE: ${{ steps.pages.outputs.base_url }}/stockfish/
        run: |
          for file in public/stockfish/*; do
            # Fails (and the preview keeps its copy) where the live site has no such file.
            size=$(curl -sfI -o /dev/null -w '%header{content-length}' "$LIVE${file##*/}") || exit 0
            [ "$size" = "$(stat -c %s "$file")" ] || exit 0
          done
          echo "folder=$LIVE" >> "$GITHUB_OUTPUT"

      # Previews skip minifying, which takes about 40% of the export, so they
      # come up sooner. A build of main checks every 10 s whether main has
      # moved on, and if so stops and passes, leaving the newer run to publish.
      - name: Export the web app
        id: export
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}${{ env.PREVIEW && format('/{0}', env.PREVIEW) || '' }}
          # Previews share the live site's localStorage; this keeps them apart.
          EXPO_PUBLIC_STORAGE_PREFIX: ${{ env.PREVIEW && format('pr-{0}:', github.event.number) || '' }}
          EXPO_PUBLIC_STOCKFISH_FOLDER: ${{ steps.stockfish.outputs.folder }}
        run: |
          if [ -n "$EXPO_PUBLIC_STOCKFISH_FOLDER" ]; then rm -r public/stockfish; fi
          # Its own process group, so stopping it stops everything it started.
          setsid yarn expo export --platform web ${{ env.PREVIEW && '--no-minify' || '' }} &
          expo=$!
          superseded="$RUNNER_TEMP/superseded"
          watcher=
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            # Its output goes nowhere: a sleep holding the step's output open
            # would keep the step from finishing. A failed lookup keeps building.
            while :; do
              if main=$(git ls-remote --exit-code origin refs/heads/main) \
                && [ "${main%%$'\t'*}" != "$GITHUB_SHA" ]; then
                # Marked before the kill, so the step can't take the stop for a
                # failure, and unmarked if nothing was left to stop. An export
                # failing on its own at that same moment may pass; the newer
                # build checks its changes again, with the newer ones.
                touch "$superseded"
                kill -- "-$expo" || rm "$superseded"
                break
              fi
              sleep 10
            done > /dev/null 2>&1 &
            watcher=$!
          fi
          status=0
          wait "$expo" || status=$?
          # The watcher may have stopped already.
          [ -z "$watcher" ] || kill "$watcher" 2> /dev/null || true
          if [ -e "$superseded" ]; then
            echo "::notice::Stopped: a newer push to main builds and publishes instead."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$status" = 0 ] || exit "$status"
          # Pages shows the site's root 404.html for any path it has no file for.
          cp dist/+not-found.html dist/404.html

      - name: Upload the site
        if: steps.export.outputs.superseded != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 1

  # .agents/projects/autoland.md lists this job's name as a required check; rename both together.
  publish:
    name: Publish
    needs: build
    # Runs after a build, or alone when a pull request closes. Only main
    # replaces the site. Fork and Dependabot pull requests get a read-only
    # token, so they never publish.
    if: >-
      !cancelled()
      && ((needs.build.result == 'success' && needs.build.outputs.superseded != 'true')
        || github.event.action == 'closed')
      && (github.event_name == 'pull_request'
        && !github.event.pull_request.head.repo.fork
        && github.event.pull_request.user.login != 'dependabot[bot]'
        || github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One publish per pull request at a time, so a close waits for the
    # preview it removes. Main's runs don't queue, because a newer run would
    # cancel the waiting one and mark its commit failed; an older one skips
    # publishing below instead. Runs retry on each other's pushes below.
    concurrency:
      group: pages-publish-${{ github.event.pull_request.number || github.run_id }}
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}

    steps:
      - name: Check out the site's publish script
        if: env.PREVIEW == ''
        uses: actions/checkout@v7
        with:
          path: repo
          sparse-checkout: scripts/replace-site.mjs
          sparse-checkout-cone-mode: false

      - name: Download the site
        if: github.event.action != 'closed'
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - name: Update the gh-pages branch
        id: push
        run: |
          # gh-pages holds a single commit, so old builds don't pile up in every
          # clone. Each run rebuilds that commit from the branch's current tree
          # and pushes only if nobody pushed in between; otherwise it retries.
          # Every run also keeps previews only for open pull requests, which
          # removes a closed one's, even when its last build finished late.
          shopt -s nullglob
          site="$GITHUB_WORKSPACE/site"
          # Where this run's site goes in the branch.
          target=${PREVIEW:-.}
          pages="$RUNNER_TEMP/pages"
          for attempt in 1 2 3 4 5; do
            cd "$RUNNER_TEMP" && rm -rf "$pages" && git init -q "$pages" && cd "$pages"
            copied=false
            git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            lease=
            if git fetch -q --depth=1 origin gh-pages; then
              lease=$(git rev-parse FETCH_HEAD)
              git checkout -q FETCH_HEAD
            fi
            # Listed after the fetch, so a preview pushed since then is kept.
            open=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 1000 --json number --jq '.[].number')
            for preview in pr-preview/pr-*; do
              grep -qx "${preview#pr-preview/pr-}" <<< "$open" || rm -rf "$preview"
            done
            if [ "$target" = . ]; then
              node "$GITHUB_WORKSPACE/repo/scripts/replace-site.mjs" "$site"
              copied=true
            else
              rm -rf "$target"
              if [ -d "$site" ] && grep -qx "$PR" <<< "$open"; then
                mkdir -p "$target"
                cp -R "$site/." "$target/"
                copied=true
              fi
            fi
            # Pages would otherwise run Jekyll, which drops _expo/.
            touch .nojekyll
            git add -A
            tree=$(git write-tree)
            # A newer push to main publishes its own build, so this older one
            # would only roll the site back. Checked on every attempt, right
            # before pushing; a failed lookup retries rather than skipping.
            if [ "$target" = . ]; then
              main=$(git ls-remote --exit-code origin refs/heads/main) || { sleep $((attempt * 5)); continue; }
              if [ "${main%%$'\t'*}" != "$GITHUB_SHA" ]; then
                echo "::notice::Not published: a newer push to main publishes instead."
                exit 0
              fi
            fi
            # An unchanged tree (say, a close after a run already dropped the
            # preview) skips the push, which would only rebuild Pages. A re-run
            # or manual run still pushes, to retry a failed Pages build.
            if [ -z "$lease" ] || [ "$tree" != "$(git rev-parse "$lease^{tree}")" ] \
              || [ "$GITHUB_RUN_ATTEMPT" -gt 1 ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              commit=$(git commit-tree "$tree" -m "Web run $GITHUB_RUN_ID ($GITHUB_EVENT_NAME${PR:+ #$PR})")
              if ! git push -q --force-with-lease="gh-pages:$lease" origin "$commit:refs/heads/gh-pages"; then
                sleep $((attempt * 5))
                continue
              fi
            fi
            echo "copied=$copied" >> "$GITHUB_OUTPUT"
            exit 0
          done
          exit 1

      - name: Comment the preview address
        if: github.event_name == 'pull_request'
        env:
          COPIED: ${{ steps.push.outputs.copied }}
          URL: ${{ needs.build.outputs.site-url }}/${{ env.PREVIEW }}/
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # One comment per pull request, updated on every push. A run that
          # published no preview (its pull request closed) says it's gone.
          marker='<!-- web-preview -->'
          if [ "$COPIED" = true ]; then
            body="$marker
          **Preview:** $URL

          Built from $SHA, without minifying. Pages takes about a minute to serve a new build."
          else
            body="$marker
          Preview removed: this pull request closed."
          fi
          # First matching id (head -n 1 can trip pipefail).
          ids=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          elif [ "$COPIED" = true ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
