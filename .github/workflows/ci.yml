# Lints, typechecks and runs the unit tests on every pull request and every
# push to main. The web export is checked separately, in web.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes this run worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install
        id: install
        run: yarn install --immutable

      # The checks after Install run even when an earlier one fails, so one
      # run reports every kind of failure.
      - name: Lint
        run: yarn lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome != 'failure' }}
        run: yarn typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome != 'failure' }}
        run: yarn test
