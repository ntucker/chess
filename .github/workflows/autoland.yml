# Lands a feature pull request without a manual merge. It starts when a PR has
# the `autoland` label and names a piece of a plan Nathaniel approved by
# merging it into docs/plans/. A fresh reviewer (Claude Sonnet, high effort)
# uses the feature in a browser and checks its interfaces against that plan.
# If the reviewer approves and every other check and reviewer is satisfied,
# the PR is squash-merged. Rules: docs/plans/README.md.
#
# pull_request_target runs this file as it is on main, so a PR cannot change
# the rules that judge it. Only branches in this repo (people with write
# access) are handled. The PR's code runs only in the build job, which has a
# read-only token, no secrets and no cache; the jobs holding the Claude token
# or a write token only read the PR's files and serve its built web app.
name: Autoland

on:
  pull_request_target:
    types: [labeled, synchronize, ready_for_review]

permissions: {}

jobs:
  gate:
    name: Plan approval
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'autoland') &&
      (github.event.action != 'labeled' || github.event.label.name == 'autoland')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.piece.outputs.plan }}
      piece: ${{ steps.piece.outputs.piece }}
      markdown_only: ${{ steps.files.outputs.markdown_only }}

    steps:
      - name: Checkout the approved plans on main
        uses: actions/checkout@v7
        with:
          sparse-checkout: docs/plans
          persist-credentials: false

      - name: Find the plan piece the PR names
        id: piece
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          line=$(printf '%s\n' "$BODY" | tr -d '\r' | grep -E '^Plan piece: ' | head -n 1 || true)
          if [[ ! $line =~ ^Plan\ piece:\ ([a-z0-9-]+)/([A-Za-z0-9-]+)[[:space:]]*$ ]]; then
            echo "::error::The PR body needs a line 'Plan piece: <plan>/<piece>', such as 'Plan piece: opening-lesson/K'."
            exit 1
          fi
          plan=${BASH_REMATCH[1]} piece=${BASH_REMATCH[2]}
          file="docs/plans/$plan.md"
          if [[ ! -f $file ]]; then
            echo "::error::$file is not on main, so plan '$plan' is not approved."
            exit 1
          fi
          if ! grep -Eq "^#{2,4} Piece $piece:" "$file"; then
            echo "::error::$file has no heading 'Piece $piece:', so that piece is not approved."
            exit 1
          fi
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "piece=$piece" >> "$GITHUB_OUTPUT"

      - name: Refuse changes to approvals and process
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A failed listing must stop the gate, not look like an empty PR.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          [[ -n $files ]]
          blocked=$(printf '%s\n' "$files" | grep -E '^(docs/plans/|\.github/|\.agents/projects/|PROJECTS\.md$|\.claude/|\.mcp\.json$)|(^|/)CLAUDE\.md$' || true)
          if [[ -n $blocked ]]; then
            echo "::error::Only Nathaniel merges changes to plans, workflows, agent settings and the project process:"
            printf '%s\n' "$blocked"
            exit 1
          fi
          # CI and the web build skip Markdown-only PRs, so Land can't require them.
          if printf '%s\n' "$files" | grep -qv '\.md$'; then
            echo "markdown_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "markdown_only=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Autoland build
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: autoland-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Checkout the PR
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      # No dependency cache: this event saves caches where main's workflows
      # read them, and the PR's code must not write there.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: yarn install --immutable

      - name: Export the web app
        run: |
          yarn expo export --platform web
          # Pages shows 404.html for any path it has no file for.
          cp dist/+not-found.html dist/404.html

      - name: Upload the web app
        uses: actions/upload-artifact@v5
        with:
          name: autoland-web-${{ github.event.pull_request.number }}
          path: dist
          retention-days: 3

  review:
    name: Interface review
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # A newer push makes this review worthless.
    concurrency:
      group: autoland-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      checks: read
    env:
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      # For reading only: nothing from it runs in this job.
      - name: Checkout the PR
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # The plans and the reviewer's instructions always come from main.
      - name: Checkout main's plans and instructions
        uses: actions/checkout@v7
        with:
          path: .autoland/main
          sparse-checkout: |
            docs/plans
            .github/autoland
            GOALS.md
            AGENTS.md
          persist-credentials: false

      - name: Download the web app
        uses: actions/download-artifact@v5
        with:
          name: autoland-web-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/web

      # Serves the files the way Pages does: /play is play.html, and 404.html
      # answers any other path. It starts outside the checkout, so npm reads no
      # .npmrc from the PR.
      - name: Serve the web app
        working-directory: ${{ runner.temp }}
        run: |
          npx -y serve@14.2.7 --listen 8081 "$RUNNER_TEMP/web" > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 60); do curl -fs http://localhost:8081 > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/serve.log"
          exit 1

      # Bugbot's comments are part of what the reviewer checks, so its review
      # of this commit must be finished. If it never starts, carry on.
      - name: Wait for Bugbot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 40); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=Cursor%20Bugbot" \
              --jq '.check_runs[0].status // "none"')
            [[ $status == completed ]] && exit 0
            [[ $status == none && $i -gt 20 ]] && exit 0
            sleep 30
          done
          echo "::error::Bugbot did not finish in 20 minutes"
          exit 1

      # Comments come only from Nathaniel's account (Staff and the threads'
      # replies) and Bugbot. Anyone can comment on a public repo, and nobody
      # else may steer the review. REST names Bugbot cursor[bot], GraphQL cursor.
      - name: Collect the PR, its diff and its review threads
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED: '["ntucker", "cursor"]'
        run: |
          dir=.autoland/context
          mkdir -p "$dir"
          gh pr view "$PR" --json title,body --jq '"# " + .title + "\n\n" + .body' > "$dir/pr.md"
          gh pr diff "$PR" > "$dir/pr.diff"
          gh api graphql --paginate -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F pr="$PR" -f query='
            query($owner: String!, $name: String!, $pr: Int!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 50, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      isResolved isOutdated path line
                      comments(first: 30) { nodes { author { login } body createdAt } }
                    }
                  }
                }
              }
            }' --jq '.data.repository.pullRequest.reviewThreads.nodes[]' \
            | jq -s --argjson trusted "$TRUSTED" '[.[]
                | .comments = [.comments.nodes[] | select(.author.login as $a | $trusted | index($a))]
                | select(.comments | length > 0)]' > "$dir/threads.json"
          # Review summaries (the Staff review's body) and plain PR comments.
          { gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
              --jq '.[] | select(.body != "") | {kind: "review", state, author: .user.login, body, created_at: .submitted_at}'
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              --jq '.[] | {kind: "comment", author: .user.login, body, created_at}'
          } | jq -s --argjson trusted "$TRUSTED" \
              '[.[] | .author |= sub("\\[bot\\]$"; "") | select(.author as $a | $trusted | index($a))] | sort_by(.created_at)' \
              > "$dir/comments.json"

      # Claude runs outside the checkout and loads only user settings, so no
      # settings, hooks, CLAUDE.md or MCP config from the PR load next to the
      # token. It may not read /proc, where its environment is.
      - name: Review
        id: review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PLAN: ${{ needs.gate.outputs.plan }}
          PIECE: ${{ needs.gate.outputs.piece }}
        run: |
          pr=$GITHUB_WORKSPACE main=$GITHUB_WORKSPACE/.autoland/main ctx=$GITHUB_WORKSPACE/.autoland/context
          mcp=$(jq -cn --arg out "$GITHUB_WORKSPACE/.autoland/screenshots" '{mcpServers: {playwright: {command: "npx",
            args: ["-y", "@playwright/mcp@0.0.84", "--browser", "chrome", "--headless", "--isolated",
              "--caps", "vision", "--viewport-size", "1280x800", "--output-dir", $out]}}}')
          prompt="$(cat "$main/.github/autoland/review.md")

          Inputs for this review:
          - Plan piece: $PLAN/$PIECE, in $main/docs/plans/$PLAN.md
          - Goals and project notes as they are on main: $main/GOALS.md, $main/AGENTS.md
          - The PR's code (its head): $pr
          - PR #$PR: $ctx/pr.md (title and description), $ctx/pr.diff
          - Review threads and comments: $ctx/threads.json, $ctx/comments.json
          - The app, built from this PR: http://localhost:8081"
          mkdir -p "$RUNNER_TEMP/review" && cd "$RUNNER_TEMP/review"
          npx -y @anthropic-ai/claude-code@2.1.321 -p "$prompt" \
            --model claude-sonnet-5-5 --effort high --add-dir "$GITHUB_WORKSPACE" \
            --setting-sources user --mcp-config "$mcp" --strict-mcp-config \
            --allowedTools 'Read,Grep,Glob,mcp__playwright' --disallowedTools 'Read(//proc/**)' \
            --json-schema "$(cat "$main/.github/autoland/verdict.schema.json")" \
            --output-format json > "$GITHUB_WORKSPACE/.autoland/result.json"
          jq -e '.structured_output.verdict' "$GITHUB_WORKSPACE/.autoland/result.json" > /dev/null
          # Last guard: a review holding a verbatim copy of the token is never posted.
          if grep -qF "$CLAUDE_CODE_OAUTH_TOKEN" "$GITHUB_WORKSPACE/.autoland/result.json"; then
            echo "::error::The review quoted the Claude token, so it will not be posted"; exit 1
          fi

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: autoland-review-${{ github.event.pull_request.number }}
          path: .autoland/screenshots
          if-no-files-found: ignore

      - name: Post the review and pass or fail
        if: ${{ !cancelled() && steps.review.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          out=.autoland/result.json
          jq -r --arg sha "$HEAD_SHA" --arg run "$RUN_URL" '.structured_output as $r |
            "<!-- autoland-review -->\n### Autoland review: " + ($r.verdict | ascii_upcase) + " for " + $sha[0:7] + "\n\n" +
            $r.summary + "\n\n" +
            ([$r.findings[] | "- **" + .severity + "** " + .title + " (`" + .where + "`): " + .detail] | join("\n")) +
            "\n\nScreenshots and log: " + $run + "\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_"' "$out" > .autoland/comment.md
          gh pr comment "$PR" --body-file .autoland/comment.md
          [[ $(jq -r '.structured_output.verdict' "$out") == approve ]]

  land:
    name: Land
    needs: [gate, review]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: autoland-land-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      # Every other check on the reviewed commit must finish, CI and the web
      # build must pass (unless the PR changes only Markdown, which they skip),
      # and nothing may fail. The Staff reviewer's latest comment must give a
      # verdict on this commit (`**Staff Reviewer:** LGTM at <sha>`) other than
      # CHANGE_THIS_PR. A push, a removed label, a draft or a "changes
      # requested" review stops the landing.
      - name: Wait for the other checks and Staff
        env:
          REQUIRED: >-
            ${{ needs.gate.outputs.markdown_only == 'true' && '[]' || '["Lint, typecheck and test", "Build"]' }}
        run: |
          for _ in $(seq 80); do
            pr=$(gh pr view "$PR" --json state,isDraft,headRefOid,labels,reviewDecision)
            jq -e --arg sha "$HEAD_SHA" '.state == "OPEN" and (.isDraft | not) and .headRefOid == $sha
              and ([.labels[].name] | index("autoland")) and .reviewDecision != "CHANGES_REQUESTED"' <<< "$pr" > /dev/null \
              || { echo "::error::The PR changed since the review: $pr"; exit 1; }
            runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs" \
              --jq '.check_runs[] | select(.name != "Land") | {name, status, conclusion, started_at}' \
              | jq -s 'group_by(.name) | map(max_by(.started_at))')
            if jq -e 'any(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled"
                or .conclusion == "action_required")' <<< "$runs" > /dev/null; then
              echo "::error::A check failed: $runs"; exit 1
            fi
            staff=$({ gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
                        --jq '.[] | {login: .user.login, body, at: .created_at}'
                      gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
                        --jq '.[] | {login: .user.login, body, at: .submitted_at}'
                    } | jq -rs '[.[] | select(.login == "ntucker" and (.body | startswith("**Staff Reviewer:**")))]
                                | sort_by(.at) | last // {} | .body // "" | split("\n")[0]')
            on_head=false
            [[ $staff == *" at ${HEAD_SHA:0:8}"* ]] && on_head=true
            if [[ $on_head == true && $staff == *CHANGE_THIS_PR* ]]; then
              echo "::error::The Staff reviewer asked for changes: $staff"; exit 1
            fi
            if [[ $on_head == true ]] && jq -e --argjson required "$REQUIRED" '. as $runs | all(.status == "completed")
                and ($required | all(. as $name | $runs | any(.name == $name and .conclusion == "success")))' <<< "$runs" > /dev/null; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::Checks or a Staff verdict on ${HEAD_SHA:0:8} did not arrive in time"; exit 1

      # Merges made with this workflow's token start no other workflows, so it
      # starts the deploy and main's CI itself.
      - name: Squash-merge and deploy
        run: |
          gh pr merge "$PR" --squash --match-head-commit "$HEAD_SHA"
          gh workflow run web.yml --ref main
          gh workflow run ci.yml --ref main
