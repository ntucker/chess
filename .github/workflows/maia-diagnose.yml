# Temporary: find out why Maia fails on the Pages site. Not for merging.
name: Maia diagnose
on:
  push:
    branches: [claude/project-thread-wtoewx]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Proxy URL baked into the live site
        run: |
          html=$(curl -sS https://ntucker.github.io/chess/)
          for js in $(echo "$html" | grep -o '/chess/_expo/static/js/web/[^"]*\.js' | sort -u); do
            curl -sS "https://ntucker.github.io$js" | grep -o 'https://[a-z0-9.-]*workers\.dev[^"]*' | sort -u
          done
      - name: Worker preflight
        run: |
          curl -sS -i -X OPTIONS https://opening-night-maia.ntucker.workers.dev/play/get_move \
            -H 'Origin: https://ntucker.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type'
      - name: Worker POST
        run: |
          curl -sS -i -X POST 'https://opening-night-maia.ntucker.workers.dev/play/get_move?maia_name=maia_kdd_1500&maia_version=maia3&initial_clock=0&current_clock=0&increment=0' \
            -H 'Origin: https://ntucker.github.io' -H 'Content-Type: application/json' \
            --data '["e2e4"]' | head -c 3000
      - name: Maia directly from the runner
        run: |
          curl -sS -i -X POST 'https://www.maiachess.com/api/v1/play/get_move?maia_name=maia_kdd_1500&maia_version=maia3&initial_clock=0&current_clock=0&increment=0' \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data '["e2e4"]' | head -c 3000
