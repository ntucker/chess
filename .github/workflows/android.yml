# Builds the Android app on every push to main that changes more than
# Markdown, and publishes it at one fixed address, so a phone installs the
# newest build from its browser. A pull request that changes the native build
# (this file, dependencies, app config, patches) only builds. README.md, under
# "Android builds", says how to install it.
name: Android

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths:
      - .github/workflows/android.yml
      - package.json
      - yarn.lock
      - .yarn/patches/**
      - app.json
      - app.config.ts
  workflow_dispatch:

permissions:
  contents: read

env:
  # The release, and its tag, that always holds main's newest build.
  TAG: android
  # README.md links to this file on that release.
  APK: opening-night.apk

jobs:
  build:
    name: Build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install
        run: yarn install --immutable

      - name: Generate the native project
        run: yarn expo prebuild --platform android --no-install

      # Phones in use are 64-bit ARM; one architecture builds about 4x faster.
      - name: Build
        working-directory: android
        run: |
          ./gradlew assembleRelease --build-cache -PreactNativeArchitectures=arm64-v8a
          mv app/build/outputs/apk/release/app-release.apk "../$APK"

      # Release builds use the key in Expo's template (android/app/debug.keystore),
      # the same key as every build installed so far. Android installs an
      # update only over an app with the same key, so a template change would
      # make every phone refuse the next build: fail here instead.
      - name: Check the signing key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$APK" | tee certs.txt
          grep -qi 'SHA-256 digest: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' certs.txt

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: ${{ env.APK }}
          retention-days: 7

  publish:
    name: Publish the APK
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download the APK
        uses: actions/download-artifact@v8
        with:
          name: apk

      # A newer run of this workflow on main publishes its own build; this
      # older one would only replace it.
      - name: Check this is main's newest build
        id: newest
        run: |
          newer=$(gh run list --workflow android.yml --branch main --limit 20 --json databaseId \
            --jq "map(select(.databaseId > $GITHUB_RUN_ID)) | length")
          if [ "$newer" -gt 0 ]; then
            echo "::notice::Not published: a newer run on main publishes instead."
          else
            echo "newest=true" >> "$GITHUB_OUTPUT"
          fi

      # The tag stays where the first publish made it (moving it would break
      # `git fetch` in clones that have it); the notes name each build's commit.
      - name: Publish to the release
        if: steps.newest.outputs.newest
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --target "$GITHUB_SHA" --title 'Android app (newest main)' --notes ''
          gh release upload "$TAG" "$APK" --clobber
          gh release edit "$TAG" --notes "Built from $GITHUB_SHA on $(date -u '+%Y-%m-%d %H:%M UTC').

          To install it, open https://github.com/$GH_REPO/releases/download/$TAG/$APK on the phone. README.md, under \"Android builds\", has the steps."
